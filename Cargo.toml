# The bucket server (server/) and the desktop app that runs it in-process (desktop/src-tauri).
[workspace]
members = ["server", "desktop/src-tauri"]
resolver = "2"

# Lint silencing is checked, not free: #[allow] is denied; use #[expect(..., reason = "...")]
# (clippy restriction lints allow_attributes, allow_attributes_without_reason).
[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
