[project]
name = "pdfbucket"
version = "0.1.0"
description = "PDF Bucket: pikepdf and MuPDF commands the server runs on stored PDFs, and the extraction plugins."
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.25.3",
    "httpx>=0.28.1",
    "mistralai>=2.10.1",
    "pikepdf>=10.13.0.post1",
    "platformdirs>=4.11.13",
    "pydantic>=2.10",
    "pymupdf>=1.28.2",
    "tenacity>=9.1.4",
]

[project.scripts]
pdfbucket = "pdfbucket.cli:main"
pdfbucket-mineru-precise = "pdfbucket_extractors.mineru_precise:app"
pdfbucket-mistral-ocr = "pdfbucket_extractors.mistral_ocr:app"

[dependency-groups]
dev = [
    "bibtexparser>=2.0.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfbucket", "src/pdfbucket_extractors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
