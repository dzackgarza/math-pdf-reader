[project]
name = "pdfbucket"
version = "0.1.0"
description = "PDF Bucket store: provenance embedding, capture storage, plugin manifests."
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.25.3",
    "httpx>=0.28.1",
    "mistralai>=2.10.1",
    "pathvalidate>=3.3.1",
    "pikepdf>=10.13.0.post1",
    "pydantic>=2.10",
    "pymupdf>=1.28.2",
    "send2trash>=2.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
pdfbucket = "pdfbucket.cli:app"
pdfbucket-mineru-precise = "pdfbucket_extractors.mineru_precise:app"
pdfbucket-mistral-ocr = "pdfbucket_extractors.mistral_ocr:app"

[dependency-groups]
dev = [
    "bibtexparser>=2.0.1",
    "pytest>=8",
    "types-send2trash>=2.1.0.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfbucket", "src/pdfbucket_extractors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
