[project]
name = "pdfbucket"
version = "0.1.0"
description = "PDF Bucket store: provenance embedding, capture storage, plugin manifests."
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.25.3",
    "pathvalidate>=3.3.1",
    "pikepdf>=10.13.0.post1",
    "pydantic>=2.10",
]

[project.scripts]
pdfbucket = "pdfbucket.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfbucket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
