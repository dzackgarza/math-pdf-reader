[project]
name = "pdfbucket-plugins"
version = "0.1.0"
description = "Plugin manifests and command wrappers for PDF Bucket extraction and resolver plugins."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugins/pdfbucket_plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
